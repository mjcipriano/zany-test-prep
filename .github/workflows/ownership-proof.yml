# Builds the special APK the Android Developer Console asks for when you
# register this app's package name for Android developer verification.
#
# The console gives you a small file (the "snippet") and asks you to put it in
# the APK's assets folder, sign the APK with the app's release key, and upload
# it to prove you own the package name. This workflow does exactly that with
# the same stable release key the Release workflow uses, so you never need the
# keystore on your own machine.
#
# Run it from Actions -> "Ownership proof APK" -> Run workflow, paste the
# snippet's file name and contents, then download the artifact and upload the
# APK to the Android Developer Console. See docs/install.md.
name: Ownership proof APK

on:
  workflow_dispatch:
    inputs:
      snippet_filename:
        description: "File name the Developer Console asks for (e.g. adi-registration.properties)"
        required: true
      snippet_contents:
        description: "Exact contents of that file, as shown in the Developer Console"
        required: true

permissions:
  contents: read

jobs:
  build-proof:
    name: Build signed ownership-proof APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse to build without the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; the proof must be signed with the release key"; exit 1
          fi

      - name: Add the snippet to the APK assets folder
        env:
          SNIPPET_FILENAME: ${{ inputs.snippet_filename }}
          SNIPPET_CONTENTS: ${{ inputs.snippet_contents }}
        run: |
          set -euo pipefail
          name="$(basename "$SNIPPET_FILENAME")"
          if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unexpected snippet file name '$SNIPPET_FILENAME'"; exit 1
          fi
          mkdir -p android/app/src/main/assets
          printf '%s' "$SNIPPET_CONTENTS" > "android/app/src/main/assets/$name"
          echo "Wrote android/app/src/main/assets/$name ($(wc -c < "android/app/src/main/assets/$name") bytes)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Decode keystore and write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/zany-release.jks
          cat > android/key.properties <<EOT
          storeFile=zany-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOT

      - name: Build release APK
        run: flutter build apk --release

      - name: Confirm the snippet and signature
        env:
          SNIPPET_FILENAME: ${{ inputs.snippet_filename }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          name="$(basename "$SNIPPET_FILENAME")"
          unzip -l "$APK" "assets/$name"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          cp "$APK" zany-test-prep-ownership-proof.apk
          {
            echo "### Ownership proof APK"
            echo "- contains: assets/$name"
            echo "- $(grep -m1 'certificate SHA-256 digest' certs.txt)"
            echo
            echo "Upload \`zany-test-prep-ownership-proof.apk\` (artifact below) to the Android Developer Console."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof APK
        uses: actions/upload-artifact@v4
        with:
          name: ownership-proof-apk
          path: zany-test-prep-ownership-proof.apk
          if-no-files-found: error
          retention-days: 7
