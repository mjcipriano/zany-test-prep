# Release workflow — tags and publishes releases from CI so no developer
# machine (or sandboxed agent whose git proxy refuses tag pushes) ever needs
# to push a tag by hand.
#
# A release happens when any of these is true:
#   * a tag like v1.2.3 is pushed (classic path);
#   * the workflow is run manually with a `version` input (e.g. v1.2.3);
#   * master is pushed and `version:` in pubspec.yaml names a version whose
#     tag does not exist yet — i.e. bumping the version and merging to master
#     IS the release.
# Every path builds the stable-signed release APK, creates the tag on the
# built commit if it is missing, and publishes a GitHub Release with the
# tag-named APK attached. A manual run with no version only builds artifacts.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release (e.g. v2.1.0). Leave empty to only build artifacts."
        required: false
        default: ""
  push:
    branches:
      - master
    tags:
      - "v*"

# Needed to create tags/releases and upload assets.
permissions:
  contents: write

jobs:
  # Decide which tag (if any) this run releases.
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick the tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
          else
            # Push to master: release iff pubspec's version has no tag yet.
            version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; nothing to release for this push."
              tag=""
            fi
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'$tag' is not a version tag like v1.2.3"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$([[ -n "$tag" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Release tag: '${tag:-<none>}'"

  build-release:
    name: Build & Publish Release
    needs: resolve
    # A master push without a version bump has nothing to do.
    if: needs.resolve.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The release must match what CI validates: the version in pubspec.yaml
      # and the About screen's kAppVersion must agree with the tag.
      - name: Check the version matches the tag
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          pub="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          app="$(sed -nE "s/.*kAppVersion = '([^']+)'.*/\1/p" lib/core/app_info.dart | head -n1)"
          if [[ "$pub" != "$want" || "$app" != "$want" ]]; then
            echo "::error::tag $RELEASE_TAG but pubspec.yaml says $pub and kAppVersion says $app"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      # -------------------------------------------------------------------------
      # RELEASE SIGNING (stable key).
      #
      # When the KEYSTORE_BASE64 secret is set, decode the stable release keystore
      # and write android/key.properties so CI signs with the SAME key as local
      # releases — letting users update in place. Without the secret the build
      # falls back to debug signing (handled in android/app/build.gradle.kts), so
      # the workflow still runs for contributors/forks.
      #
      # Required repo secrets (Settings -> Secrets and variables -> Actions):
      #   KEYSTORE_BASE64 - base64 of android/app/zany-release.jks
      #   KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
      # -------------------------------------------------------------------------
      - name: Decode keystore and write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 not set — falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/zany-release.jks
          cat > android/key.properties <<EOT
          storeFile=zany-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOT
          echo "Wrote android/key.properties for stable release signing."

      - name: Build release APK
        run: flutter build apk --release

      # App bundle is a nice-to-have for Play Store uploads. Made non-blocking
      # with "|| true" so a failure here never fails the release.
      - name: Build release app bundle (non-blocking)
        run: flutter build appbundle --release || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 30

      # Refuse to publish an APK Android could fail to parse or verify: check
      # the signature (v2+ scheme, stable key), the manifest, zip alignment,
      # and the size, using the runner's Android SDK build-tools.
      - name: Verify the APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "Using build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > /dev/null
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion" | tee badging.txt
          size=$(stat -c %s "$APK")
          echo "APK size: $((size / 1024 / 1024)) MB"
          # Phones struggle to download very large files completely; keep the
          # universal APK comfortably small.
          if [ "$size" -gt $((120 * 1024 * 1024)) ]; then
            echo "::error::APK is $((size / 1024 / 1024)) MB (> 120 MB); shrink assets before releasing"; exit 1
          fi
          {
            echo "### APK check"
            echo "- size: $((size / 1024 / 1024)) MB"
            echo "- $(grep -m1 '^package:' badging.txt)"
            echo "- signer: $(grep -m1 'certificate SHA-256 digest' apksigner.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Name the APK after the tag for a clean, unambiguous release asset, and
      # publish its SHA-256 so a phone download can be checked for completeness.
      - name: Stage tag-named APK
        if: env.RELEASE_TAG != ''
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "zany-test-prep-${RELEASE_TAG}.apk"
          sha256sum "zany-test-prep-${RELEASE_TAG}.apk" > "zany-test-prep-${RELEASE_TAG}.apk.sha256"
          cat "zany-test-prep-${RELEASE_TAG}.apk.sha256"

      # Create the tag on the built commit if it does not exist yet (annotated,
      # pushed with the workflow token), then publish the Release with the
      # stable-signed, tag-named APK (sideload target) and generated notes.
      - name: Create the release tag
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Zany Test Prep ${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            **Install on Android:** download `zany-test-prep-${{ env.RELEASE_TAG }}.apk`, wait for
            the download to finish completely, then open it from your Downloads and allow
            installing from that app when asked. Full instructions and troubleshooting:
            [docs/install.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/install.md).
          files: |
            zany-test-prep-${{ env.RELEASE_TAG }}.apk
            zany-test-prep-${{ env.RELEASE_TAG }}.apk.sha256
