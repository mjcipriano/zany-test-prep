# ACT skill map. Same exam-agnostic shape as the SAT's:
#   exam -> domains -> sections -> skills -> subskills
# Skill ids shared with the SAT (e.g. linear_equations) deliberately reuse the
# same id so mastery carries across exams; ACT-only skills are new ids.
exam_id: act
version: "1.0.0"
domains:
  - id: english
    name: "English"
    sections:
      - id: conventions_of_standard_english
        name: "Conventions of Standard English"
        skills:
          - id: sentence_boundaries
            name: "Sentence Structure & Boundaries"
            subskills: [run_ons, fragments, clause_joining]
          - id: subject_verb_agreement
            name: "Subject-Verb Agreement"
            subskills: [agreement]
          - id: punctuation
            name: "Punctuation & Possessives"
            subskills: [apostrophes, commas]
          - id: pronouns
            name: "Pronoun Case"
            subskills: [pronoun_case]
          - id: modifiers
            name: "Modifier Placement"
            subskills: [dangling_modifiers]
          - id: verb_tense
            name: "Verb Tense & Form"
            subskills: [tense_consistency]
          - id: parallel_structure
            name: "Parallel Structure"
            subskills: [parallelism]
          - id: pronoun_antecedent
            name: "Pronoun-Antecedent Agreement"
            subskills: [antecedent_agreement]
      - id: production_of_writing
        name: "Production of Writing"
        skills:
          - id: transitions
            name: "Transitions"
            subskills: [logical_transitions]
          - id: rhetorical_synthesis
            name: "Writer's Goal & Organization"
            subskills: [synthesize_notes]
      - id: knowledge_of_language
        name: "Knowledge of Language"
        skills:
          - id: concision
            name: "Concision & Precision"
            subskills: [eliminate_redundancy]
          - id: usage_idioms
            name: "Usage & Idioms"
            subskills: [confused_words, idiomatic_prepositions, comparatives, word_precision]
  - id: math
    name: "Math"
    sections:
      - id: number_and_quantity
        name: "Number & Quantity"
        skills:
          - id: number_properties
            name: "Number Properties"
            subskills: [factors_multiples, primes, integer_reasoning, order_of_operations, scientific_notation, fractions_decimals_percents]
          - id: exponents_radicals
            name: "Exponents & Radicals"
            subskills: [exponent_rules, radical_simplify]
          - id: complex_numbers
            name: "Complex Numbers"
            subskills: [powers_of_i, arithmetic, conjugates, modulus]
      - id: algebra
        name: "Algebra"
        skills:
          - id: linear_equations
            name: "Linear Equations"
            subskills: [one_variable, two_variable, slope_intercept]
          - id: linear_inequalities
            name: "Linear Inequalities"
            subskills: [one_variable, graph_regions]
          - id: systems_of_equations
            name: "Systems of Equations"
            subskills: [substitution, elimination]
          - id: word_problems
            name: "Linear Word Problems"
            subskills: [model_and_solve]
          - id: absolute_value
            name: "Absolute Value"
            subskills: [solve_equations]
          - id: polynomials
            name: "Polynomial Expressions"
            subskills: [operations, factoring]
      - id: functions
        name: "Functions"
        skills:
          - id: functions
            name: "Functions"
            subskills: [evaluate, interpret]
          - id: quadratics
            name: "Quadratics"
            subskills: [factoring, vertex, roots]
          - id: exponential
            name: "Exponential Growth"
            subskills: [growth_decay]
          - id: sequences
            name: "Sequences"
            subskills: [arithmetic, geometric, sums, recursive]
          - id: logarithms
            name: "Logarithms"
            subskills: [evaluate, convert_forms, properties, solve_exponential]
      - id: geometry
        name: "Geometry"
        skills:
          - id: area_volume
            name: "Area & Volume"
            subskills: [area, volume]
          - id: circles
            name: "Circles"
            subskills: [circumference_area, arc_sector]
          - id: right_triangles
            name: "Right Triangles"
            subskills: [pythagorean, special_triangles]
          - id: trigonometry
            name: "Trigonometry"
            subskills: [sohcahtoa]
          - id: angles_polygons
            name: "Angles & Polygons"
            subskills: [parallel_lines, triangle_angles, polygon_angles]
          - id: coordinate_geometry
            name: "Coordinate Geometry"
            subskills: [distance, midpoint, circle_equation, parallel_perpendicular, point_on_line]
      - id: statistics_probability
        name: "Statistics & Probability"
        skills:
          - id: statistics
            name: "Statistics"
            subskills: [mean_median_mode, spread]
          - id: probability
            name: "Probability"
            subskills: [simple_probability, two_way_tables]
          - id: data_analysis
            name: "Data Analysis"
            subskills: [tables, graphs]
          - id: two_way_tables
            name: "Two-Way Tables"
            subskills: [conditional_probability]
          - id: scatterplots
            name: "Scatterplots & Line of Best Fit"
            subskills: [model_interpret]
          - id: ratios_percentages_units
            name: "Ratios, Percentages, and Units"
            subskills: [percent_change, unit_rate]
          - id: proportions
            name: "Proportions"
            subskills: [direct_proportion, scaling]
  - id: reading
    name: "Reading"
    sections:
      - id: key_ideas_and_details
        name: "Key Ideas & Details"
        skills:
          - id: main_idea
            name: "Central Ideas & Themes"
            subskills: [central_idea, summary]
          - id: inferences
            name: "Inferences"
            subskills: [logical_completion, implied_meaning]
          - id: command_of_evidence
            name: "Supporting Details & Evidence"
            subskills: [textual_evidence, quantitative_evidence]
      - id: craft_and_structure
        name: "Craft & Structure"
        skills:
          - id: words_in_context
            name: "Words in Context"
            subskills: [vocabulary, precise_word_choice]
          - id: text_structure_purpose
            name: "Text Structure & Purpose"
            subskills: [overall_structure, authors_purpose]
      - id: integration_of_knowledge
        name: "Integration of Knowledge & Ideas"
        skills:
          - id: cross_text_connections
            name: "Comparing Passages"
            subskills: [compare_viewpoints]
  - id: science
    name: "Science"
    sections:
      - id: interpretation_of_data
        name: "Interpretation of Data"
        skills:
          - id: data_representation
            name: "Reading Tables & Graphs"
            subskills: [lookup, compare, consistency, figure_reading]
          - id: trends_extrapolation
            name: "Trends & Extrapolation"
            subskills: [trend_direction, interpolation, extrapolation, relationships]
      - id: scientific_investigation
        name: "Scientific Investigation"
        skills:
          - id: experimental_design
            name: "Experimental Design"
            subskills: [variables, controls, design_changes, hypotheses, predictions]
      - id: evaluation_of_models
        name: "Evaluation of Models & Viewpoints"
        skills:
          - id: conflicting_viewpoints
            name: "Conflicting Viewpoints"
            subskills: [compare_viewpoints, evidence_evaluation]
